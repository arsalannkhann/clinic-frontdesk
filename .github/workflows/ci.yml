name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: clinic_voice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_voice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://clinic:ci_synthetic_only@localhost:5432/clinic_voice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Verify committed API contract
        run: |
          clinic-voice export-openapi > /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
  # Actions are pinned by major tag, matching the verify job above; pin both jobs by commit
  # SHA together if the repository adopts SHA pinning.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # No install scripts: none of the pinned dev dependencies needs one to build or test.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The contract test compares the generated body only; this checks the whole committed
      # file matches a fresh generation from docs/openapi.json.
      - name: Verify generated API types
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts
