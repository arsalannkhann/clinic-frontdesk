[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clinic-voice-ai"
version = "0.1.0"
description = "Multilingual clinic receptionist foundation for Bolna and Sarvam"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1"]

[project.scripts]
clinic-voice = "clinic_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
