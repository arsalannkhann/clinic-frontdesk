services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_local_only
      POSTGRES_DB: clinic_voice
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_voice"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
